<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="EduAlex" />
    <meta name="description" content="Generador de Código QR" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
    <title>QR</title>
  </head>
  <body>
    <main>
      <div class="container">
        <h1 class="logo">QR</h1>
        
        <form id="qrForm">
          <div class="input-row">
            <input
              type="text"
              id="textInput"
              placeholder="URL o texto"
              maxlength="80"
              required
            />
            <button type="submit">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
          
          <div class="controls">
            <input type="color" id="color" value="#000000" title="Color QR" />
            <input type="color" id="bgColor" value="#ffffff" title="Fondo" />
            <span class="divider"></span>
            <input type="number" id="sizeInput" value="300" min="150" max="1000" title="Tamaño px" />
          </div>
        </form>
        
        <div id="result"></div>
      </div>
    </main>
  </body>
</html>
